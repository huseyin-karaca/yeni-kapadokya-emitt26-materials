<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Wall Design TR</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: #555; display: flex; justify-content: center; padding: 20px; zoom: 0.25; }

        .rollup-container {
            width: 1950px; height: 2370px;
            background: #fff;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* Lightbox style background - exact copy of gradient logic */
        .header-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 1800px;
            background: #f5f5f5;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            z-index: 0;
        }

        /* Content Centering */
        .content { 
            position: relative; 
            z-index: 2; 
            padding: 100px; 
            height: 100%; 
            width: 100%;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            gap: 0; /* Boşluk sıfırlandı, negatif margin ile kontrol edilebilir */
        }
        
        header { 
            text-align: center; 
            width: 100%;
            margin-bottom: 0;
            margin-top: -200px;
        }

        .hero { 
            text-align: center; 
            color: #333; 
            margin-top: -200px;
        }
        .hero h1 { 
            font-size: 10rem; /* Adjusted for width 1950 vs 3000 */
            font-weight: 800; 
            line-height: 1.1; 
            margin: 0; 
            color: #333; 
        }
        
        .hero span { 
            color: #D32F2F; 
            display: inline-block; 
            position: relative; 
            z-index: 1; 
        }
        
        /* Marker effect behind span */
        .hero span::after {
            content: ''; position: absolute; bottom: 20px; left: -15px; right: -15px; height: 35px;
            background: rgba(211, 47, 47, 0.15); z-index: -1; transform: rotate(-1deg);
        }

    </style>
</head>
<body>

    <div class="rollup-container">
        <!-- Background Pattern -->
        <div class="header-bg"></div>
        
        <div class="content">

            <header>
                <!-- Lightbox Logo Usage (Same File) -->
                <img src="../assets/logos/logo-vector-turkce.svg" alt="YENİ KAPADOKYA" style="width: 100%; max-width: 1500px;">
            </header>

            <div class="hero">
                <h1>YEREL UZMANLIK,<br><span>KÜRESEL STANDARTLAR</span></h1>
            </div>

        </div>
    </div>

</body>
</html>
