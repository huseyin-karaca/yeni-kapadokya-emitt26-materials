<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightbox Design TR</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: #555; display: flex; justify-content: center; padding: 20px; zoom: 0.2; }

        .rollup-container {
            width: 3000px; height: 2500px;
            background: #fff;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* ALT 2: Clean Corporate - Light Grey Header */
        .header-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 1800px;
            background: #f5f5f5; /* Çok açık gri */
            /* Hafif bir fade out */
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            z-index: 0;
        }

        .content { position: relative; z-index: 2; padding: 200px 250px; height: 100%; display: flex; flex-direction: column; }

        header { text-align: center; margin-top: -150px; margin-bottom: 0; color: #333; }
        .brand-big { font-size: 5rem; font-weight: 900; letter-spacing: -2px; color: #222; }
        .brand-small { font-size: 2rem; letter-spacing: 5px; opacity: 0.6; margin-top: 5px; text-transform: uppercase; color: #D32F2F; font-weight: 700; }

        .hero { text-align: center; color: #333; margin-bottom: 100px; }
        .hero h1 { font-size: 14rem; font-weight: 800; line-height: 1.1; margin-bottom: 60px; color: #333; }
        .hero span { color: #D32F2F; display: inline-block; position: relative; z-index: 1; }
        /* Marker effect behind span */
        .hero span::after {
            content: ''; position: absolute; bottom: 20px; left: -20px; right: -20px; height: 50px;
            background: rgba(211, 47, 47, 0.15); z-index: -1; transform: rotate(-1deg);
        }
        .hero p { font-size: 1.6rem; font-weight: 500; color: #666; font-style: normal; }

        /* GRID LAYOUT FOR FEATURES */
        .features-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            margin-bottom: 40px;
        }
        <!-- .grid-item {
            background: white; border-radius: 20px; padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            border: 1px solid #eee;
            text-align: center;
            transition: transform 0.3s ease;
        } -->
        .grid-item {
            background: white; border-radius: 20px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-bottom: 5px solid #D32F2F;
            text-align: center;
        }
        .grid-icon { font-size: 3rem; color: #D32F2F; margin-bottom: 15px; }
        .grid-title { font-size: 1.6rem; font-weight: 700; color: #333; margin-bottom: 10px; }
        .grid-desc { font-size: 1.3rem; color: #666; line-height: 1.4; }

        /* CTA BOX (Upper) */
        .cta-box {
            background: #D32F2F; border-radius: 5px; padding: 5px 4px;
            text-align: center; margin-bottom: 1px;
            box-shadow: 0 15px 30px rgba(211, 47, 47, 0.3);
        }
        .cta-big { font-size: 2rem; font-weight: 900; color: #fff; margin: 0; text-transform: uppercase; letter-spacing: 1px; }

        /* FOOTER (Contact) */
        .footer { 
            background: #fff; border-radius: 20px; padding: 35px; margin-top: auto;
            display: flex; align-items: center; justify-content: space-between;
            color: #333;
            border: 1px solid #eee;
        }
        .contact-group div { font-size: 1.7rem; margin-bottom: 10px; font-weight: 600; color: #333; }
        .contact-group i { color: #D32F2F; width: 35px; text-align: center; }

    </style>
</head>
<body>

    <div class="rollup-container">
        <!-- Background Pattern Container -->
        <div class="header-bg"></div>
        
        <div class="content">

            <div class="hero">
                <h1>KAPADOKYA'DAKİ<br><span>OPERASYON GÜCÜNÜZ</span></h1>
            </div>

            <header>
                <img src="../assets/logos/logo-vector-turkce.svg" alt="YENİ KAPADOKYA TURİZM" style="width: 100%; max-width: 2000px;">
            </header>
        </div>
    </div>

</body>
</html>
